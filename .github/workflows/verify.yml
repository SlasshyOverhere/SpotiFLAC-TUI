name: verify
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: |
            go.sum
            SpotiFLAC-Mobile/go_backend/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - run: go run ./cmd/spotiflac --selfcheck
