name: release
on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - id: backend-sha
        run: echo "sha=$(git -C SpotiFLAC-Mobile rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: version
        run: echo "v=v$(date -u +%Y.%m.%d.%H%M)" >> "$GITHUB_OUTPUT"
      - name: Skip if release exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.v }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build all targets
        if: steps.check.outputs.exists == 'false'
        run: |
          V=${{ steps.version.outputs.v }}
          mkdir -p dist
          set -e
          for target in \
            "linux amd64 .tar.gz" \
            "linux arm64 .tar.gz" \
            "linux arm .tar.gz" \
            "linux 386 .tar.gz" \
            "darwin amd64 .tar.gz" \
            "darwin arm64 .tar.gz" \
            "windows amd64 .zip" \
            "windows arm64 .zip" \
            "freebsd amd64 .tar.gz" \
            "openbsd amd64 .tar.gz" \
            "netbsd amd64 .tar.gz" \
            "illumos amd64 .tar.gz"; do
            set -- $target
            os=$1; arch=$2; ext=$3
            bin=spotiflac_${os}_${arch}
            out=dist/$bin
            if [ "$os" = "windows" ]; then
              out=dist/${bin}.exe
            fi
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
              -ldflags "-X spotiflac-cli/internal/update.Version=$V -X spotiflac-cli/internal/update.Repo=${{ github.repository }}" \
              -o "$out" ./cmd/spotiflac
            if [ "$ext" = ".zip" ]; then
              (cd dist && zip -q "$bin$ext" "${bin}.exe")
              rm "$out"
            else
              tar -C dist -czf "dist/${bin}${ext}" "$bin"
              rm "$out"
            fi
            sha256sum "dist/${bin}${ext}" > "dist/${bin}${ext}.sha256"
          done
      - name: Publish
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.version.outputs.v }}
          gh release create "$V" dist/*.tar.gz dist/*.zip dist/*.sha256 \
            --title "auto: backend ${{ steps.backend-sha.outputs.sha }}" \
            --notes "Automated build of upstream SpotiFLAC backend @ ${{ steps.backend-sha.outputs.sha }}"
